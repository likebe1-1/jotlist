version: 2

updates:
  # Gradle / AndroidX / Kotlin 依赖的自动升级 PR（安全补丁也会走这里）。
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"

  # GitHub Actions 固定到 commit SHA 后，由 Dependabot 负责跟进版本。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
